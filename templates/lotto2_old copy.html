<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <title>樂透號碼</title>
</head>

<body>
  <h1>樂透號碼</h1>
  {% for num_list in random_num_list %}
  {% comment %} <h1>{{ num_list }}</h1> {% endcomment %}
  <h1>
      第{{ forloop.counter }}組號碼：
       {% for num in num_list %}
          {{ num }}
          {% if not forloop.last %}
             ,
          {% endif %}
       {% endfor %}
  {% endfor %}
  
</body>

</html>
